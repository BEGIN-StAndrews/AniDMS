[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anidms"
version = "1.1.0"
description = "AniDMS: query daily DMS data from monthly files and annotate tracking records with LAEA-IDW"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Meixuan Liu", email = "ml340@st-andrews.ac.uk" }
]
keywords = ["dms", "netcdf", "trajectory", "geospatial", "zenodo"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "pandas>=1.3.0",
  "numpy>=1.20.0",
  "xarray>=0.18.0",
  "scipy>=1.7.0",
  "netCDF4>=1.5.0",
  "requests>=2.25.0",
  "pyproj>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/BEGIN-StAndrews/AniDMS"
Repository = "https://github.com/BEGIN-StAndrews/AniDMS"
Issues = "https://github.com/BEGIN-StAndrews/AniDMS/issues"

[tool.setuptools.packages.find]
include = ["anidms", "anidms.*"]
